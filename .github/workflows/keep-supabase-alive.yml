name: Keep Supabase Alive

# Runs every 6 hours to prevent Supabase free-tier pausing (7-day inactivity limit)
on:
  schedule:
    - cron: '0 */6 * * *'       # Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch:            # Allow manual trigger from GitHub UI

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Heartbeat Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "🏓 Running Supabase keep-alive heartbeat..."
          echo "   Target URL: ${SUPABASE_URL}"
          echo ""

          # Validate secrets are configured
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "❌ FATAL: GitHub Secrets SUPABASE_URL or SUPABASE_ANON_KEY are not set!"
            echo "   Go to: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # ---------------------------------------------------------------------------
          # Step 1: Real Database WRITE (UPSERT)
          # A POST/UPSERT cannot be cached by Cloudflare, Kong, or CDN proxies.
          # It generates real PostgreSQL disk I/O and WAL activity to ensure
          # Supabase's compute telemetry registers active database usage.
          # ---------------------------------------------------------------------------
          echo "📝 [1/2] Performing database WRITE (upsert heartbeat)..."
          PAYLOAD="[{\"id\":\"__heartbeat__\",\"name\":\"KeepAlive Heartbeat\",\"cards\":\"[]\",\"createdAt\":\"${TIMESTAMP}\",\"strategy\":\"Prevent Supabase Inactivity Pausing\",\"is_saved\":0}]"

          WRITE_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "${SUPABASE_URL}/rest/v1/saved_decks" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=representation" \
            -d "$PAYLOAD")

          WRITE_HTTP_CODE=$(echo "$WRITE_RESPONSE" | tail -n 1)
          WRITE_BODY=$(echo "$WRITE_RESPONSE" | sed '$d')

          echo "   Write HTTP Status: $WRITE_HTTP_CODE"
          echo "   Write Response: $WRITE_BODY"

          if [ "$WRITE_HTTP_CODE" -eq 200 ] || [ "$WRITE_HTTP_CODE" -eq 201 ]; then
            echo "   ✅ Database WRITE successful! WAL and transaction committed."
          else
            echo "   ⚠️ Warning: WRITE failed with status $WRITE_HTTP_CODE. Body: $WRITE_BODY"
          fi
          echo ""

          # ---------------------------------------------------------------------------
          # Step 2: Database READ Check
          # ---------------------------------------------------------------------------
          echo "🔍 [2/2] Performing database READ verification..."
          READ_RESPONSE=$(curl -s -w "\n%{http_code}" \
            "${SUPABASE_URL}/rest/v1/cards?select=id,name&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Cache-Control: no-cache, no-store")

          READ_HTTP_CODE=$(echo "$READ_RESPONSE" | tail -n 1)
          READ_BODY=$(echo "$READ_RESPONSE" | sed '$d')

          echo "   Read HTTP Status: $READ_HTTP_CODE"
          echo "   Read Response: $READ_BODY"
          echo ""

          # Validation
          if [ "$READ_HTTP_CODE" -eq 200 ] 2>/dev/null; then
            if echo "$READ_BODY" | grep -q '"id"'; then
              echo "✅ Supabase is 100% ALIVE and active! Database responded with valid data."
            else
              echo "⚠️ HTTP 200 but response doesn't look like card data."
              exit 1
            fi
          elif [ "$READ_HTTP_CODE" -eq 0 ] 2>/dev/null || [ -z "$READ_HTTP_CODE" ]; then
            echo "❌ FAILED: Could not connect to Supabase at all (DNS/network error)."
            echo "   The project is likely PAUSED. Go to https://supabase.com/dashboard to restore it."
            exit 1
          else
            echo "❌ FAILED: Unexpected HTTP status $READ_HTTP_CODE."
            exit 1
          fi
